<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Personal Blog</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <div class="container">
            <h1>Welcome to My Interactive Personal Blog Platform</h1>
            <p>This platform allows you to create and manage your personal blog with ease.</p>
            <div class="new-post">
                <h2 id="new-post"><span id="post-action">New</span> Post</h2>
                <form id="post-form">
                    <div class="form-group">
                        <label for="post-title">Title:</label>
                        <input type="text" id="post-title" name="title" required minlength="5" maxlength="200">
                        <span class="error-message" id="titleError"></span>
                    </div>
                    <div class="form-group">
                        <label for="post-content">Content:</label>
                        <textarea id="post-content" name="content" required minlength="10" maxlength="1000"></textarea>
                        <span class="error-message" id="contentError"></span>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary mb-3">Publish</button>
                        <button type="reset" class="btn btn-secondary mb-3">Reset</button>
                    </div>
                </form>
            </div>
            <h2 id="title-recent-posts">Recent Posts</h2>
            <div class="recent-posts">
                <div class="post"></div>
            </div>
        </div>

    </main>
    <footer>
        <p>&copy; 2026 MMB Interactive Personal Blog. All rights reserved.</p>
    </footer>
</body>
</html>
